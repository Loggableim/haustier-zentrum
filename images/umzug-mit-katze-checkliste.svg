<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#fff3e0"/><g font-family="system-ui,sans-serif" fill="#39271b"><text x="70" y="110" font-size="54" font-weight="700">Umzug mit Katze</text><text x="70" y="165" font-size="28">Ein Plan für Menschen. Ein sicherer Rückzug für die Katze.</text><g fill="white" stroke="#e68900" stroke-width="3"><rect x="70" y="225" width="320" height="280" rx="18"/><rect x="440" y="225" width="320" height="280" rx="18"/><rect x="810" y="225" width="320" height="280" rx="18"/></g><g font-size="30" font-weight="700"><text x="95" y="280">1. Vorbereiten</text><text x="465" y="280">2. Umziehen</text><text x="835" y="280">3. Ankommen</text></g><g font-size="25"><text x="95" y="345">□ Aufgaben verteilen</text><text x="95" y="395">□ Tasche packen</text><text x="95" y="445">□ Box prüfen</text><text x="465" y="345">□ Türen sichern</text><text x="465" y="395">□ Katze begleiten</text><text x="465" y="445">□ Übergabe klären</text><text x="835" y="345">□ Ruhe ermöglichen</text><text x="835" y="395">□ Verhalten beachten</text><text x="835" y="445">□ Daten aktualisieren</text></g><text x="70" y="575" font-size="24">Haustierzentrum · Organisationshilfe, kein fester Eingewöhnungsfahrplan</text></g></svg>