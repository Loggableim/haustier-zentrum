name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public assets only
        run: |
          python _refresh_indexing.py --dry-run
          python _generate_feed.py --dry-run
          python _build_public.py
          python _check_release.py dist
          node _test_consent.cjs
          python _test_editorial_claims.py
          python _test_health_safety.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest pages deploy dist --project-name haustier-zentrum --branch main
